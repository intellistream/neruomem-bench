# ============================================================================
# NeuroMem Benchmark — Segment Service on LoCoMo
# ============================================================================
#
# A plain segment baseline for the bench-native LoCoMo pipeline.
# It uses the native time/size segment service without external adapters so
# the resulting run can serve as a simple structure-aware baseline in Panel A.
# ============================================================================

runtime:
  dataset: "locomo"
  test_segments: 5
  memory_name: "segment"

  api_key: "EMPTY"
  base_url: "http://localhost:18000/v1"
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  max_tokens: 128
  temperature: 0.0
  seed: 42

  prompt_template: |
    Based on the above context, answer the following question concisely
    using exact words from the context whenever possible.
    If the information is not mentioned in the conversation,
    respond with "Not mentioned in the conversation".

services:
  services_type: "partitional.segment"

  segment:
    segment_strategy: "time"
    time_window: 3600
    max_segment_size: 32
    vector_dim: 1024

operators:
  pre_insert:
    action: "none"
  post_insert:
    action: "none"
  pre_retrieval:
    action: "none"
  post_retrieval:
    action: "none"
    conversation_format_prompt: |
      The following is some history information.