# ============================================================================
# NeuroMem Benchmark — mem0 on LoCoMo 配置（本地 FAISS 模式）
# ============================================================================
#
# mem0 官方文档: https://docs.mem0.ai
#
# 本配置使用 FAISS 作为向量存储（无需 Qdrant），完全本地运行。
# 依赖：
#   - mem0ai（pip install mem0ai，已包含 FAISS 支持）
#   - faiss-cpu（pip install faiss-cpu）
#   - LLM 服务（bash scripts/deploy/deploy_llama31_8b.sh）
#   - Embedding 服务（bash scripts/deploy/deploy_bge_m3.sh）
#
# 使用方式:
#   python -m benchmarks.simple_experiment.simple_pipeline \
#       --config benchmarks/simple_experiment/config/mem0_locomo.yaml \
#       --task_id conv-mini-01
#
# 若需要 Qdrant 模式，将 vector_store 部分改为：
#   vector_store:
#     provider: "qdrant"
#     config:
#       collection_name: "neuromem_bench_mem0"
#       host: "localhost"
#       port: 6333
# ============================================================================

# ── 运行时参数 ──────────────────────────────────────────────────────────────
runtime:
  dataset: "locomo"              # 数据集名称，需提前注册到 DataLoaderFactory
  # task_id: "conv-26"           # 任务 ID，也可通过 --task_id 命令行参数传入
  test_segments: 3               # 将总问题数分成 N 段依次触发测试
  memory_name: "mem0"            # 输出目录标识（.sage/benchmarks/.../mem0/）

  # LLM 服务（用于问答评估阶段）
  api_key: "EMPTY"
  base_url: "http://localhost:18000/v1"
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  max_tokens: 256
  temperature: 0.0
  seed: 42

  pipeline_service_timeout: 300.0

  # QA 评估提示词（与 TiM 实验保持一致以确保公平比较）
  prompt_template: |
    Answer in a short phrase (3-8 words). Plain text only. No ** or formatting.
    - For "what/who": just the thing/person
    - For "when":    just the date/time
    - For "why":     start with "because"

    Q: {question}
    A:

# ── 记忆服务配置 ────────────────────────────────────────────────────────────
services:
  services_type: "simple.mem0"

  mem0:
    top_k: 5                     # 每次检索返回的最大记忆条数
    user_id_scope: "auto"        # "auto" = task_id + 时间戳（每次运行隔离）
                                 # "task" = task_id 固定（跨运行共享记忆）

    # mem0 内部配置（透传给 mem0.Memory.from_config()）
    mem0_config:
      llm:
        provider: "openai"
        config:
          model: "meta-llama/Llama-3.1-8B-Instruct"
          openai_base_url: "http://localhost:18000/v1"
          api_key: "EMPTY"
          max_tokens: 2000
          temperature: 0.0

      embedder:
        provider: "openai"
        config:
          model: "BAAI/bge-m3"
          openai_base_url: "http://localhost:18001/v1"
          api_key: "EMPTY"
          # embedding_dims 不传：vLLM 的 BGE-M3 不支持维度截断参数

      vector_store:
        provider: "faiss"
        config:
          collection_name: "neuromem_bench_mem0"
          # path: null  → 不持久化，每次运行从空记忆开始
          distance_strategy: "cosine"
          embedding_model_dims: 1024   # 必须与 embedder 输出维度一致

# ── 检索算子配置 ────────────────────────────────────────────────────────────
operators:
  simple_retrieval:
    # 检索结果送入 MemoryEvaluation 前的文本前缀
    conversation_format_prompt: "The following are relevant memories:\n"
